<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dayline — Plan your day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14181C;
    --ink-soft:#1E252B;
    --paper:#FBF8F1;
    --paper-line:#E4DFD2;
    --text-on-dark:#F4F1E8;
    --text-on-dark-dim:#9AA3A8;
    --text-on-paper:#1E2328;
    --text-on-paper-dim:#6B6357;
    --accent:#2955A3;
    --accent-dim:#7C93B8;
    --walk:#C98A2E;
    --drive:#3E6EA8;
    --train:#3F7D5C;
    --bus:#8B4F8C;
    --none:#8A8377;
    --danger:#B4432F;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--text-on-dark);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .wrap{max-width:640px;margin:0 auto;padding:28px 18px 0;}

  /* ---------- Header ---------- */
  header{margin-bottom:22px;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent-dim);
    margin:0 0 6px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:34px;
    line-height:1.05;
    margin:0 0 8px;
    letter-spacing:-.01em;
  }
  h1 span{color:var(--accent-dim);}
  .sub{color:var(--text-on-dark-dim);font-size:14.5px;line-height:1.5;margin:0;max-width:46ch;}

  /* ---------- Section shells ---------- */
  section{margin-bottom:26px;}
  .section-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--text-on-dark-dim);
    margin:0 0 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-label::after{content:"";flex:1;height:1px;background:#2A3138;}

  /* ---------- Time control card ---------- */
  .time-card{
    background:var(--ink-soft);
    border:1px solid #262D34;
    border-radius:var(--radius);
    padding:16px;
  }
  .time-toggle{display:flex;gap:8px;margin-bottom:12px;}
  .time-toggle button{
    flex:1;
    padding:9px;
    border-radius:9px;
    border:1px solid #2A3138;
    background:transparent;
    color:var(--text-on-dark-dim);
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .time-toggle button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .time-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .time-row label{font-size:13px;color:var(--text-on-dark-dim);}
  .time-row input[type=time]{
    font-family:'IBM Plex Mono',monospace;
    font-size:16px;
    background:var(--ink);
    border:1px solid #2A3138;
    color:var(--text-on-dark);
    border-radius:8px;
    padding:7px 10px;
  }
  .start-point-name{
    flex:1;
    min-width:140px;
    background:var(--ink);
    border:1px solid #2A3138;
    color:var(--text-on-dark);
    border-radius:8px;
    padding:7px 10px;
    font-family:'Inter',sans-serif;
    font-size:14px;
  }
  .start-point-name::placeholder{color:#5A6067;}

  /* ---------- Stop builder ---------- */
  .stop-list{display:flex;flex-direction:column;gap:10px;}
  .stop-card{
    background:var(--ink-soft);
    border:1px solid #262D34;
    border-radius:var(--radius);
    padding:14px;
  }
  .stop-card-top{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;}
  .stop-index{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--text-on-dark-dim);
    width:20px;
    padding-top:9px;
    flex-shrink:0;
  }
  .stop-name-input{
    flex:1;
    background:var(--ink);
    border:1px solid #2A3138;
    color:var(--text-on-dark);
    border-radius:8px;
    padding:8px 10px;
    font-family:'Inter',sans-serif;
    font-size:15px;
    font-weight:600;
  }
  .stop-actions{display:flex;gap:4px;flex-shrink:0;}
  .icon-btn{
    width:30px;height:30px;
    border-radius:7px;
    border:1px solid #2A3138;
    background:var(--ink);
    color:var(--text-on-dark-dim);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;
  }
  .icon-btn:hover{color:var(--text-on-dark);border-color:#3A424A;}
  .icon-btn.remove:hover{color:var(--danger);border-color:var(--danger);}

  .stop-fields{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-on-dark-dim);
  }
  .mode-select{display:flex;gap:5px;}
  .mode-btn{
    flex:1;
    padding:7px 0;
    border-radius:7px;
    border:1px solid #2A3138;
    background:var(--ink);
    color:var(--text-on-dark-dim);
    cursor:pointer;
    font-size:15px;
    display:flex;align-items:center;justify-content:center;
  }
  .mode-btn.active[data-mode="walk"]{background:var(--walk);border-color:var(--walk);color:#fff;}
  .mode-btn.active[data-mode="drive"]{background:var(--drive);border-color:var(--drive);color:#fff;}
  .mode-btn.active[data-mode="train"]{background:var(--train);border-color:var(--train);color:#fff;}
  .mode-btn.active[data-mode="bus"]{background:var(--bus);border-color:var(--bus);color:#fff;}

  .num-field{display:flex;align-items:center;gap:4px;}
  .num-field input{
    width:100%;
    background:var(--ink);
    border:1px solid #2A3138;
    color:var(--text-on-dark);
    border-radius:7px;
    padding:7px 8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
  }
  .num-field span{font-size:12px;color:var(--text-on-dark-dim);flex-shrink:0;}

  .add-stop-btn{
    width:100%;
    padding:12px;
    border-radius:var(--radius);
    border:1.5px dashed #333B43;
    background:transparent;
    color:var(--text-on-dark-dim);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    margin-top:10px;
  }
  .add-stop-btn:hover{border-color:var(--accent-dim);color:var(--text-on-dark);}

  .empty-hint{
    color:var(--text-on-dark-dim);
    font-size:13.5px;
    text-align:center;
    padding:26px 10px;
    border:1.5px dashed #2A3138;
    border-radius:var(--radius);
  }

  /* ---------- Timeline (signature element) ---------- */
  .timeline{position:relative;padding-left:2px;}
  .leg{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 0 8px 15px;
    margin-left:15px;
    border-left:3px solid var(--mode-color, var(--none));
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--text-on-dark-dim);
  }
  .leg .leg-icon{
    width:22px;height:22px;
    border-radius:50%;
    background:var(--mode-color, var(--none));
    display:flex;align-items:center;justify-content:center;
    font-size:12px;
    flex-shrink:0;
    margin-left:-27px;
    border:3px solid var(--ink);
  }
  .leg .leg-text{color:var(--text-on-dark);font-weight:600;}
  .leg .leg-time{color:var(--text-on-dark-dim);}

  .stop-ticket{
    position:relative;
    margin-left:15px;
    background:var(--paper);
    color:var(--text-on-paper);
    border-radius:10px;
    padding:14px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    border-left:3px solid var(--paper);
  }
  .stop-ticket::before{
    content:"";
    position:absolute;
    left:-3px;top:-3px;bottom:-3px;
    width:3px;
    background:repeating-linear-gradient(to bottom, var(--ink) 0 6px, transparent 6px 12px);
  }
  .stop-ticket-main{min-width:0;}
  .stop-ticket-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;margin:0 0 3px;}
  .stop-ticket-dur{font-size:12px;color:var(--text-on-paper-dim);}
  .stop-ticket-times{
    font-family:'IBM Plex Mono',monospace;
    text-align:right;
    flex-shrink:0;
    line-height:1.35;
  }
  .stop-ticket-times .arr{font-size:16px;font-weight:600;}
  .stop-ticket-times .dep{font-size:11px;color:var(--text-on-paper-dim);}

  .day-total{
    margin-top:16px;
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--text-on-dark-dim);
  }
  .day-total b{color:var(--text-on-dark);}

  .footer-actions{display:flex;gap:10px;margin-top:20px;}
  .footer-actions button{
    flex:1;
    padding:11px;
    border-radius:10px;
    border:1px solid #2A3138;
    background:transparent;
    color:var(--text-on-dark-dim);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .footer-actions button:hover{color:var(--text-on-dark);border-color:#3A424A;}

  @media (max-width:420px){
    h1{font-size:28px;}
    .stop-fields{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Dayline · itinerary builder</p>
    <h1>Plan the <span>route</span> of your day</h1>
    <p class="sub">List your stops, pick how you'll get between them, and set one fixed time — Dayline lays out arrivals and departures for the rest.</p>
  </header>

  <section>
    <p class="section-label">Anchor time</p>
    <div class="time-card">
      <div class="time-toggle">
        <button id="btnStart" class="active" onclick="setAnchorMode('start')">Fix start time</button>
        <button id="btnEnd" onclick="setAnchorMode('end')">Fix end time</button>
      </div>
      <div class="time-row">
        <label id="anchorLabel">Leave</label>
        <input type="time" id="anchorTime" value="09:00" oninput="onAnchorTimeInput(this.value)">
        <input type="text" class="start-point-name" id="startPointName" placeholder="From (e.g. hotel) — optional" oninput="onStartPointInput(this.value)">
      </div>
    </div>
  </section>

  <section>
    <p class="section-label">Stops</p>
    <div class="stop-list" id="stopList"></div>
    <button class="add-stop-btn" onclick="addStop()">+ Add a stop</button>
  </section>

  <section id="timelineSection" style="display:none;">
    <p class="section-label">Your day</p>
    <div class="timeline" id="timeline"></div>
    <div class="day-total" id="dayTotal"></div>
  </section>

  <div class="footer-actions">
    <button onclick="clearAll()">Clear day</button>
  </div>
</div>

<script>
const MODES = {
  walk:  {icon:'🚶', label:'Walk',  color:'var(--walk)'},
  drive: {icon:'🚗', label:'Drive', color:'var(--drive)'},
  train: {icon:'🚆', label:'Train', color:'var(--train)'},
  bus:   {icon:'🚌', label:'Bus',   color:'var(--bus)'}
};

let state = {
  anchorMode: 'start', // 'start' or 'end'
  anchorTime: '09:00',
  startPointName: '',
  stops: []
};

function uid(){ return Math.random().toString(36).slice(2,9); }

function loadState(){
  try{
    const saved = localStorage.getItem('dayline_v1');
    if(saved){
      const parsed = JSON.parse(saved);
      state = Object.assign(state, parsed);
    }
  }catch(e){}
  if(state.stops.length === 0){
    state.stops.push(newStop());
  }
}

function saveState(){
  try{ localStorage.setItem('dayline_v1', JSON.stringify(state)); }catch(e){}
}

function newStop(){
  return { id:uid(), name:'', duration:60, mode:'walk', travelTime:15 };
}

function addStop(){
  state.stops.push(newStop());
  render();
}

function removeStop(id){
  state.stops = state.stops.filter(s => s.id !== id);
  if(state.stops.length === 0) state.stops.push(newStop());
  render();
}

function moveStop(id, dir){
  const i = state.stops.findIndex(s => s.id === id);
  const j = i + dir;
  if(j < 0 || j >= state.stops.length) return;
  [state.stops[i], state.stops[j]] = [state.stops[j], state.stops[i]];
  render();
}

function updateStop(id, field, value){
  const stop = state.stops.find(s => s.id === id);
  if(stop) stop[field] = value;
  saveState();
  renderTimeline();
}

function setAnchorMode(mode){
  state.anchorMode = mode;
  document.getElementById('btnStart').classList.toggle('active', mode === 'start');
  document.getElementById('btnEnd').classList.toggle('active', mode === 'end');
  document.getElementById('anchorLabel').textContent = mode === 'start' ? 'Leave' : 'Be back by';
  render();
}

function clearAll(){
  if(!confirm('Clear the whole day plan?')) return;
  state = { anchorMode:'start', anchorTime:'09:00', startPointName:'', stops:[newStop()] };
  localStorage.removeItem('dayline_v1');
  render();
}

function fmtTime(mins){
  const overflow = Math.floor(mins / 1440);
  const m = ((mins % 1440) + 1440) % 1440;
  const h = Math.floor(m/60);
  const mm = m % 60;
  const ampm = h < 12 ? 'am' : 'pm';
  let h12 = h % 12; if(h12 === 0) h12 = 12;
  const label = `${h12}:${String(mm).padStart(2,'0')}${ampm}`;
  return overflow !== 0 ? `${label} (${overflow > 0 ? '+' : ''}${overflow}d)` : label;
}

function fmtDuration(mins){
  const h = Math.floor(mins/60), m = mins % 60;
  if(h === 0) return `${m}m`;
  if(m === 0) return `${h}h`;
  return `${h}h ${m}m`;
}

function timeToMins(t){
  const [h,m] = t.split(':').map(Number);
  return h*60+m;
}

function renderStopList(){
  const container = document.getElementById('stopList');
  container.innerHTML = '';
  state.stops.forEach((stop, idx) => {
    const card = document.createElement('div');
    card.className = 'stop-card';

    const isFirst = idx === 0;
    card.innerHTML = `
      <div class="stop-card-top">
        <div class="stop-index">${idx+1}</div>
        <input class="stop-name-input" placeholder="Place name" value="${escapeAttr(stop.name)}"
          oninput="updateStop('${stop.id}','name',this.value)">
        <div class="stop-actions">
          <button class="icon-btn" title="Move up" onclick="moveStop('${stop.id}',-1)" ${idx===0?'disabled style=\"opacity:.3\"':''}>↑</button>
          <button class="icon-btn" title="Move down" onclick="moveStop('${stop.id}',1)" ${idx===state.stops.length-1?'disabled style=\"opacity:.3\"':''}>↓</button>
          <button class="icon-btn remove" title="Remove" onclick="removeStop('${stop.id}')">✕</button>
        </div>
      </div>
      <div class="stop-fields">
        <div class="field" style="grid-column:1/-1;">
          <label>${isFirst ? 'Getting there from start' : 'Getting there from previous stop'}</label>
          <div class="mode-select">
            ${Object.keys(MODES).map(m => `
              <button type="button" class="mode-btn ${stop.mode===m?'active':''}" data-mode="${m}"
                onclick="updateStop('${stop.id}','mode','${m}'); render();">${MODES[m].icon}</button>
            `).join('')}
          </div>
        </div>
        <div class="field">
          <label>Travel time</label>
          <div class="num-field">
            <input type="number" min="0" step="5" value="${stop.travelTime}"
              oninput="updateStop('${stop.id}','travelTime', parseInt(this.value)||0)">
            <span>min</span>
          </div>
        </div>
        <div class="field">
          <label>Time at stop</label>
          <div class="num-field">
            <input type="number" min="0" step="5" value="${stop.duration}"
              oninput="updateStop('${stop.id}','duration', parseInt(this.value)||0)">
            <span>min</span>
          </div>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

function escapeAttr(str){
  return (str || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

function computeSchedule(){
  const stops = state.stops.filter(s => s.name.trim() !== '');
  if(stops.length === 0) return null;

  const results = stops.map(s => ({...s, arrive:0, depart:0}));

  if(state.anchorMode === 'start'){
    let current = timeToMins(state.anchorTime);
    const startDepart = current;
    results.forEach(s => {
      s.arrive = current + s.travelTime;
      s.depart = s.arrive + s.duration;
      current = s.depart;
    });
    return { results, startDepart, endArrive:null };
  } else {
    let current = timeToMins(state.anchorTime); // final depart from last stop
    for(let i = results.length-1; i >= 0; i--){
      results[i].depart = current;
      results[i].arrive = results[i].depart - results[i].duration;
      current = results[i].arrive - results[i].travelTime;
    }
    return { results, startDepart:current, endArrive:null };
  }
}

function renderTimeline(){
  const schedule = computeSchedule();
  const section = document.getElementById('timelineSection');
  const timeline = document.getElementById('timeline');
  const totalEl = document.getElementById('dayTotal');

  if(!schedule){
    section.style.display = 'none';
    return;
  }
  section.style.display = 'block';
  timeline.innerHTML = '';

  const startLabel = state.startPointName.trim() || (state.anchorMode==='start' ? 'Start point' : 'Start point');

  // first leg from start point
  const firstMode = MODES[schedule.results[0].mode];
  const leg0 = document.createElement('div');
  leg0.className = 'leg';
  leg0.style.setProperty('--mode-color', firstMode.color);
  leg0.innerHTML = `<div class="leg-icon">${firstMode.icon}</div>
    <span class="leg-text">Depart ${fmtTime(schedule.startDepart)}</span>
    <span class="leg-time">${startLabel} · ${fmtDuration(schedule.results[0].travelTime)} ${firstMode.label.toLowerCase()}</span>`;
  timeline.appendChild(leg0);

  schedule.results.forEach((s, idx) => {
    const ticket = document.createElement('div');
    ticket.className = 'stop-ticket';
    ticket.innerHTML = `
      <div class="stop-ticket-main">
        <p class="stop-ticket-name">${escapeHtml(s.name)}</p>
        <p class="stop-ticket-dur">${fmtDuration(s.duration)} here</p>
      </div>
      <div class="stop-ticket-times">
        <div class="arr">${fmtTime(s.arrive)}</div>
        <div class="dep">until ${fmtTime(s.depart)}</div>
      </div>`;
    timeline.appendChild(ticket);

    if(idx < schedule.results.length - 1){
      const next = schedule.results[idx+1];
      const mode = MODES[next.mode];
      const leg = document.createElement('div');
      leg.className = 'leg';
      leg.style.setProperty('--mode-color', mode.color);
      leg.innerHTML = `<div class="leg-icon">${mode.icon}</div>
        <span class="leg-text">${fmtDuration(next.travelTime)} ${mode.label.toLowerCase()}</span>
        <span class="leg-time">to ${escapeHtml(next.name)}</span>`;
      timeline.appendChild(leg);
    }
  });

  const last = schedule.results[schedule.results.length-1];
  const totalMins = last.depart - schedule.startDepart;
  totalEl.innerHTML = `Out for <b>${fmtDuration(totalMins)}</b> · leave ${fmtTime(schedule.startDepart)} → back ${fmtTime(last.depart)}`;
}

function escapeHtml(str){
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render(){
  saveState();
  document.getElementById('anchorTime').value = state.anchorTime;
  document.getElementById('startPointName').value = state.startPointName;
  renderStopList();
  renderTimeline();
}

// These two inputs update state + the timeline directly, without
// rewriting their own .value mid-keystroke (which was clobbering input).
function onAnchorTimeInput(value){
  state.anchorTime = value;
  saveState();
  renderTimeline();
}
function onStartPointInput(value){
  state.startPointName = value;
  saveState();
  renderTimeline();
}

loadState();
setAnchorMode(state.anchorMode);
render();
</script>
</body>
</html>
